<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speech Emotion Recognition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <p class="eyebrow">AI audio classifier</p>
        <h1 id="pageTitle">Speech Emotion Recognition</h1>
        <p class="subtitle">
          Upload a short WAV recording and detect whether the voice sounds
          angry, happy, neutral, or sad.
        </p>
      </div>

      <div class="wave-card" aria-hidden="true">
        <div class="waveform">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </section>

    <section class="uploader" aria-labelledby="uploadTitle">
      <div class="section-head">
        <h2 id="uploadTitle">Analyze Audio</h2>
        <p>Use a clean `.wav` file for the most reliable prediction.</p>
      </div>

      <form id="uploadForm">
        <label class="drop-zone" for="audioFile">
          <input type="file" id="audioFile" accept=".wav,audio/wav" />
          <span class="file-icon" aria-hidden="true">WAV</span>
          <span class="file-title" id="fileTitle">Choose a file</span>
          <span class="file-help" id="fileHelp">No file selected</span>
        </label>

        <button id="predictButton" type="submit">Predict Emotion</button>
      </form>

      <div id="result" class="result idle" role="status" aria-live="polite">
        Ready for upload.
      </div>
    </section>
  </main>

  <script src="config.js?v=3"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
